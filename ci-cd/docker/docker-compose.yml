version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusops-postgres
    environment:
      POSTGRES_DB: nexusops
      POSTGRES_USER: nexusops
      POSTGRES_PASSWORD: nexusops
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusops -d nexusops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusops-network

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    command: redis-server --appendonly yes --requirepass nexusops
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nexusops", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusops-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexusops-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nexusops-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: nexusops-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - nexusops-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: nexusops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - nexusops-network
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.2
    container_name: nexusops-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - nexusops-network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: nexusops-tempo
    command:
      - -config.file=/etc/tempo.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    networks:
      - nexusops-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    container_name: nexusops-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - nexusops-network
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  nexusops-network:
    driver: bridge