nexusops:
  platform:
    tenant:
      default-status: ACTIVE
      default-subscription-tier: FREE
      max-users-default: 100
      max-assets-default: 1000
    feature-flags:
      cache-ttl-seconds: 60
      default-rollout: 0
    settings:
      cache-ttl-seconds: 300
      validation-enabled: true
    audit:
      partition-retention-months: 13
      async-write: true
      batch-size: 100
      flush-interval-ms: 5000